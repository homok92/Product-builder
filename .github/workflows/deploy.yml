name: Deploy livingtmw.com custom code

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: livingtmw-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install SFTP client
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Trust the livingtmw.com SFTP host key
        shell: bash
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' '[sftp.livingtmw.com]:2222 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEA9vFtKna38qiQl4rl0tDPxpPAYYMMPsPWLuWINPVNL' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy custom MU plugin
        shell: bash
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          test -n "$SFTP_HOST"
          test -n "$SFTP_PORT"
          test -n "$SFTP_USERNAME"
          test -n "$SFTP_PASSWORD"
          lftp -u "$SFTP_USERNAME","$SFTP_PASSWORD" "sftp://$SFTP_HOST" <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 20
          set sftp:connect-program "ssh -a -x -p $SFTP_PORT -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          # Always sync tracked plugin files so content changes are not skipped
          # when the server preserves a newer or equal timestamp.
          mirror --reverse --verbose --ignore-time --no-perms site/wp-content/mu-plugins /wp-data/wp-content/mu-plugins
          # Remove retired bootstrap experiments that older SFTP mirrors retained.
          rm -f /wp-data/wp-content/mu-plugins/000-0-livingtmw-policy-bootstrap.php
          rm -f /wp-data/wp-content/mu-plugins/001-livingtmw-policy-refresh.php
          rm -f /wp-data/wp-content/mu-plugins/livingtmw-custom/living-tools-v3.php
          rm -f /wp-data/wp-content/mu-plugins/zz-livingtmw-policy-output.php
          put -O /wp-data site/public/robots.txt
          bye
          LFTP

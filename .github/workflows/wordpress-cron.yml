name: Trigger livingtmw.com WordPress cron

on:
  schedule:
    # Avoid the top-of-hour queue while keeping publication delay under 5 minutes.
    - cron: "2-57/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: livingtmw-wordpress-cron
  cancel-in-progress: true

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Run due WordPress tasks
        shell: bash
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --max-time 30 \
            --retry 2 \
            --retry-all-errors \
            --user-agent "livingtmw-github-cron/1.0" \
            "https://livingtmw.com/wp-cron.php?doing_wp_cron=$(date +%s)" \
            --output /dev/null
